name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backend-build:
    name: Backend - install & syntax check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # No bundler/build step on the backend (plain CommonJS), so a syntax
      # check on every source file is the cheapest real signal that
      # nothing is broken - catches typos/syntax errors without needing
      # MongoDB, Tally, or any secret.
      - name: Syntax-check every backend source file
        run: |
          set -e
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check server.js

      # Same check this repo's own security audit already established as
      # the bar to hold (see TallyPulse-Security-Audit.md) - fails the
      # build on a new high/critical vulnerability in a direct or
      # transitive dependency.
      - name: npm audit (production dependencies only)
        run: npm audit --omit=dev --audit-level=high

  frontend-build:
    name: Frontend - install, lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # Pure render/API-layer checks (no network, no browser).
      - name: Frontend verification scripts
        run: |
          set -e
          for f in verify-*.mjs; do node "$f"; done

  backend-verify-suites:
    name: Backend - self-contained verification suites
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand(\"ping\").ok' || mongo --quiet --eval 'db.runCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      # A throwaway, CI-local database - never the real Atlas cluster.
      MONGODB_URI: mongodb://127.0.0.1:27017/tallypulse_ci
      # Not a real secret - only used to sign/verify JWTs created and
      # checked entirely within this same CI run.
      JWT_SECRET: ci-only-throwaway-jwt-secret-never-used-outside-this-workflow
      # Deliberately unreachable: CI has no TallyPrime instance. The
      # suites below are written to treat "Tally unreachable" as an
      # expected, gracefully-handled case (see e.g.
      # verify-reconciliation-history.js), not a crash - this just makes
      # that path deterministic instead of hanging on a real timeout.
      TALLY_URL: http://127.0.0.1:1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # Every verify-*.js suite must at least parse.
      - name: Syntax-check every verification script
        run: |
          set -e
          for f in verify-*.js; do node --check "$f"; done

      # Deliberately NOT the full backend/verify-*.js list. Excluded:
      #   - Live TallyPrime integration (a specific real company must be open
      #     in a real TallyPrime instance - local/manual runs only):
      #     verify-voucher-type-classification.js, verify-voucher-lifecycle.js,
      #     verify-sync-worker-guard.js, verify-reconciliation.js.
      #   - Suites that talk to a RUNNING backend on :5000 or to the real
      #     tenants' data: verify-company-guid-match.js, verify-dashboard-real-data.js,
      #     verify-reports.js, verify-voucher-pagination.js.
      #   - verify-planner-live-eval.js and `verify-nlu-eval.js --live`: real,
      #     billed Anthropic calls - never run automatically/unattended in CI.
      # Everything below is self-contained: synthetic data it creates and
      # cleans up itself, a stub Tally (not a live one) or an explicit,
      # gracefully-handled "Tally unreachable" path, and a scripted planner
      # client rather than a live Anthropic call (the network is poisoned in
      # the AI suites). The real-tenant oracle sections of the query suites
      # (verify-query-parity.js and the "REAL DATA" sections) print SKIPPED when
      # the real tenants do not exist in the database - as here - and run
      # against them locally.
      - name: Run self-contained verify-*.js suites
        run: |
          failed=0
          # Suites whose real-data sections (WE FOUR tenant) skip in CI. Their DB parts run; the skipped
          # sections are reported as PARTIAL. Any other SKIP in a suite fails the job.
          PARTIAL="verify-query-chat.js verify-query-engine.js verify-query-planner.js verify-comparison-period-capability.js verify-growth-comparison-capability.js verify-return-analytics.js verify-return-ranking.js verify-stock-group-analytics.js"
          for f in \
            verify-tally-parser-voucher-total.js \
            verify-sales-mapper.js \
            verify-sales-import.js \
            verify-migrate-voucher-total-amount.js \
            verify-security-audit.js \
            verify-db-connection-guard.js \
            verify-company-identity.js \
            verify-company-ownership.js \
            verify-multi-company.js \
            verify-self-heal.js \
            verify-sync-batching.js \
            verify-voucher-recovery.js \
            verify-reconciliation-history.js \
            verify-reconciliation-perf-and-failure.js \
            verify-analytics-scope.js \
            verify-period-engine.js \
            verify-month-boundary-dates.js \
            verify-timezone-boundaries.js \
            verify-stock-item-master.js \
            verify-stock-item-gst.js \
            verify-voucher-line-details.js \
            verify-insights.js \
            verify-stock-group-analytics.js \
            verify-ledger-master.js \
            verify-adjustment-note.js \
            verify-query-dsl.js \
            verify-query-engine.js \
            verify-query-cache.js \
            verify-query-parity.js \
            verify-entity-resolver.js \
            verify-query-planner.js \
            verify-query-chat.js \
            verify-semantic-foundation.js \
            verify-comparison-period-capability.js \
            verify-growth-comparison-capability.js \
            verify-return-query.js \
            verify-return-analytics.js \
            verify-return-ranking.js \
            verify-product-return-analytics.js \
            verify-presentation.js \
            verify-ai-telemetry.js \
            verify-ai-usage-persist.js \
            verify-cost-forensic.js \
            verify-chat-management.js \
            verify-nlu-eval.js \
            verify-openrouter-eval.js \
            verify-planner-digest.js ; do
            if [ "$f" = "verify-query-parity.js" ]; then
              echo "NOT RUN (real-data gated, needs the WE FOUR tenant): $f"
              continue
            fi
            echo "::group::$f"
            out=$(mktemp)
            rc=0
            node "$f" >"$out" 2>&1 || rc=$?
            cat "$out"
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then
              echo "FAIL $f (exit $rc)"
              failed=1
            elif grep -qE '^[[:space:]]*SKIP' "$out"; then
              case " $PARTIAL " in
                *" $f "*) echo "PARTIAL $f (real-data sections skipped: $(grep -cE '^[[:space:]]*SKIP' "$out"))" ;;
                *) echo "FAIL $f (a required check was skipped)"; failed=1 ;;
              esac
            else
              echo "PASS $f"
            fi
            rm -f "$out"
          done
          exit $failed
